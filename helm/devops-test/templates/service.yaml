apiVersion: v1
kind: Service
metadata:
  name: devops-test
  labels:
    {{- include "devops-test.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "devops-test.selectorLabels" . | nindent 4 }}
