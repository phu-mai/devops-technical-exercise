replicaCount: 2

image:
  repository: devops-test
  pullPolicy: IfNotPresent
  tag: "latest"

greetingName: "default"

ingress:
  enabled: true
  hosts:
    - host: localhost
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Must exceed SHUTDOWN_DELAY_SECONDS (10) + DRAIN_TIMEOUT_SECONDS (20).
terminationGracePeriodSeconds: 45

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 2
  timeoutSeconds: 1
  failureThreshold: 1

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - devops-test
      topologyKey: "kubernetes.io/hostname"
